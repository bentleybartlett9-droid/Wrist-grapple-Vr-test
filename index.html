<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wrist Grapple VR V4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07101b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#ui{position:absolute;z-index:10;left:14px;top:14px;width:min(390px,calc(100% - 28px));padding:15px 16px;border:1px solid #425064;border-radius:15px;background:rgba(8,16,28,.94)}
h2{margin:0 0 6px;font-size:19px}.small{font-size:13px;line-height:1.45;color:#b8c6d6}
button{width:100%;min-height:50px;margin-top:12px;border:0;border-radius:11px;background:#6ee7b7;color:#06271c;font-weight:800;font-size:16px}
#status{margin-top:9px;font-size:13px;color:#d4e1ed}
</style>
</head>
<body>
<div id="ui">
<h2>🪝 Wrist Grapple V4</h2>
<div class="small">Quest-safe test scene. In VR, aim a controller at a cyan anchor and hold the trigger to pull toward it. Release to launch.</div>
<button id="enter">ENTER VR</button>
<div id="status">Loading 3D scene…</div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const status=document.getElementById("status");
const enter=document.getElementById("enter");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07101b);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,100);
camera.position.set(0,1.6,4);

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 alpha:false,
 powerPreference:"default"
});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight,false);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

const rig=new THREE.Group();
rig.position.set(0,0,4);
scene.add(rig);
rig.add(camera);

// Very simple lighting/objects for maximum Quest Browser compatibility.
scene.add(new THREE.AmbientLight(0xffffff,2.0));

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),
 new THREE.MeshBasicMaterial({color:0x182333})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

const grid=new THREE.GridHelper(30,30,0x587086,0x314052);
grid.position.y=.01;
scene.add(grid);

function makeBox(x,y,z,s,c){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(s,s,s),
  new THREE.MeshBasicMaterial({color:c})
 );
 m.position.set(x,y,z);scene.add(m);
}
makeBox(-3,1,-4,2,0x3b536e);
makeBox(3,1,-6,2,0x3b536e);
makeBox(-4,2,-9,2.5,0x3b536e);
makeBox(4,2.5,-11,3,0x3b536e);

const anchors=[];
function makeAnchor(x,y,z){
 const g=new THREE.Group();
 g.position.set(x,y,z);
 const core=new THREE.Mesh(
  new THREE.SphereGeometry(.2,12,12),
  new THREE.MeshBasicMaterial({color:0x00ffff})
 );
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.35,.05,8,24),
  new THREE.MeshBasicMaterial({color:0xffffff})
 );
 g.add(core,ring);
 scene.add(g);anchors.push(g);
}
[
 [-3,2.5,-4],[0,3.5,-5],[3,2.5,-6],[-4,4,-9],
 [0,5,-10],[4,4.5,-11],[-3,5,-14],[3,6,-15]
].forEach(p=>makeAnchor(...p));

const controllers=[
 renderer.xr.getController(0),
 renderer.xr.getController(1)
];
controllers.forEach(c=>scene.add(c));

const ropes=[];
const grapple=[null,null];
for(let i=0;i<2;i++){
 const r=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
   new THREE.Vector3(),new THREE.Vector3()
  ]),
  new THREE.LineBasicMaterial({color:0x00ffff})
 );
 r.visible=false;scene.add(r);ropes.push(r);
}

const velocity=new THREE.Vector3();
const handPrevious=[new THREE.Vector3(),new THREE.Vector3()];
const handVelocity=[new THREE.Vector3(),new THREE.Vector3()];
const havePrevious=[false,false];

function nearestAnchor(p){
 let best=null,bestDistance=2.5;
 for(const a of anchors){
  const q=a.getWorldPosition(new THREE.Vector3());
  const d=q.distanceTo(p);
  if(d<bestDistance){best=a;bestDistance=d}
 }
 return best;
}
function startGrapple(i){
 const p=controllers[i].getWorldPosition(new THREE.Vector3());
 const a=nearestAnchor(p);
 if(a){grapple[i]=a;ropes[i].visible=true}
}
function stopGrapple(i){
 if(!grapple[i])return;
 const cp=controllers[i].getWorldPosition(new THREE.Vector3());
 const pp=camera.getWorldPosition(new THREE.Vector3());
 const away=pp.clone().sub(cp).normalize();
 velocity.addScaledVector(away,2.0);
 velocity.addScaledVector(handVelocity[i],.18);
 grapple[i]=null;ropes[i].visible=false;
}
controllers.forEach((c,i)=>{
 c.addEventListener("selectstart",()=>startGrapple(i));
 c.addEventListener("selectend",()=>stopGrapple(i));
});

let vrSession=null;
async function startVR(){
 try{
  status.textContent="Starting VR…";
  if(!navigator.xr)throw new Error("WebXR is not available in this browser.");
  const supported=await navigator.xr.isSessionSupported("immersive-vr");
  if(!supported)throw new Error("Quest says immersive VR is unavailable.");
  vrSession=await navigator.xr.requestSession("immersive-vr",{
   optionalFeatures:["local-floor","bounded-floor"]
  });
  vrSession.addEventListener("end",()=>{
   vrSession=null;
   status.textContent="VR ended.";
   enter.style.display="block";
  });
  renderer.xr.setReferenceSpaceType("local-floor");
  await renderer.xr.setSession(vrSession);
  enter.style.display="none";
  document.getElementById("ui").style.display="none";
 }catch(e){
  status.textContent="VR error: "+(e&&e.message?e.message:String(e));
 }
}
enter.addEventListener("click",startVR);

function physics(dt){
 for(let i=0;i<2;i++){
  const p=controllers[i].getWorldPosition(new THREE.Vector3());
  if(havePrevious[i])handVelocity[i].copy(p).sub(handPrevious[i]).multiplyScalar(1/Math.max(dt,.001));
  handPrevious[i].copy(p);havePrevious[i]=true;
  if(!grapple[i])continue;
  const a=grapple[i].getWorldPosition(new THREE.Vector3());
  const playerPos=camera.getWorldPosition(new THREE.Vector3());
  const d=a.clone().sub(playerPos);
  const len=d.length();
  if(len>.5){
   d.normalize();
   const desired=Math.min(9,3+len*1.5);
   const current=velocity.dot(d);
   velocity.addScaledVector(d,(desired-current)*Math.min(1,dt*5));
  }
  const arr=ropes[i].geometry.attributes.position.array;
  arr[0]=p.x;arr[1]=p.y;arr[2]=p.z;
  arr[3]=a.x;arr[4]=a.y;arr[5]=a.z;
  ropes[i].geometry.attributes.position.needsUpdate=true;
 }
 velocity.y-=2.0*dt;
 velocity.multiplyScalar(Math.pow((grapple[0]||grapple[1])?.18:.025,dt));
 rig.position.addScaledVector(velocity,dt);
 if(rig.position.y<0){rig.position.y=0;if(velocity.y<0)velocity.y=0}
 rig.position.x=THREE.MathUtils.clamp(rig.position.x,-10,10);
 rig.position.z=THREE.MathUtils.clamp(rig.position.z,-22,7);
}

let last=performance.now();
function animate(){
 const now=performance.now();
 const dt=Math.min((now-last)/1000,.033);last=now;
 physics(dt);
 renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

status.textContent="3D scene loaded. Press ENTER VR.";
addEventListener("resize",()=>{
 renderer.setSize(innerWidth,innerHeight,false);
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
});
</script>
</body>
</html>
