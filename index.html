<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wrist Grapple VR — Movement Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050812;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#hud{position:absolute;z-index:10;left:16px;top:16px;width:min(390px,calc(100% - 32px));padding:16px;border:1px solid #334155;border-radius:16px;background:rgba(10,17,30,.9);backdrop-filter:blur(10px)}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:13px;color:#9fb0c3;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer;background:#6ee7b7;color:#06251b}
button.secondary{background:#1e293b;color:#e2e8f0;border:1px solid #475569}
#status{margin-top:10px;font-size:13px;color:#b9c8d8}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);z-index:5;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#d8fbff}.x1{left:6px;top:0;width:2px;height:14px}.x2{left:0;top:6px;width:14px;height:2px}
</style>
</head>
<body>
<div id="hud">
<h1>🪝 Wrist Grapple Movement Lab</h1>
<div class="sub">A more polished test of the movement idea: physical arm locomotion, wrist grapples, momentum, swinging and dual-grapple launches.</div>
<div class="row"><button id="vr">Enter VR</button><button id="reset" class="secondary">Reset position</button></div>
<div id="status">Desktop preview: use WASD to move. In VR, use the controllers.</div>
</div>
<div id="cross"><i class="x1"></i><i class="x2"></i></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {VRButton} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js";
import {XRControllerModelFactory} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/XRControllerModelFactory.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050812);
scene.fog=new THREE.Fog(0x050812,10,55);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);
camera.position.set(0,1.65,4);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const vrButton=VRButton.createButton(renderer);
vrButton.style.display="none"; document.body.appendChild(vrButton);
document.querySelector("#vr").onclick=()=>vrButton.click();

scene.add(new THREE.HemisphereLight(0xb9ddff,0x1b2230,1.8));
const key=new THREE.PointLight(0x79e8ff,30,28);key.position.set(0,5,2);scene.add(key);

const player=new THREE.Group(); player.position.set(0,0,4); scene.add(player); player.add(camera);

const floor=new THREE.Mesh(new THREE.CylinderGeometry(14,14,.18,64),new THREE.MeshStandardMaterial({color:0x151c27,roughness:.88}));
floor.position.y=-.09;scene.add(floor);
const grid=new THREE.GridHelper(28,28,0x3a4657,0x242c38);scene.add(grid);

const platforms=[];
function platform(x,y,z,sx,sy,sz){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:0x202b3a,roughness:.75}));
 m.position.set(x,y,z);scene.add(m);platforms.push(m);
}
platform(-4,1,-4,3,.5,3);platform(4,2,-7,3,.5,3);platform(-5,3,-11,4,.5,3);platform(3,4,-13,4,.5,4);
platform(0,6,-18,7,.5,3);

const anchors=[];
function makeAnchor(x,y,z){
 const g=new THREE.Group();g.position.set(x,y,z);
 const core=new THREE.Mesh(new THREE.SphereGeometry(.17,20,20),new THREE.MeshStandardMaterial({color:0x8ef6ff,emissive:0x2cb5cc,emissiveIntensity:2.5}));
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.3,.035,12,32),new THREE.MeshBasicMaterial({color:0xc4fbff}));
 g.add(core,ring);scene.add(g);anchors.push(g);
}
[
[-4,3,-4],[-1,5,-6],[4,4,-7],[-5,5,-11],[0,7,-12],[3,6,-15],[-4,7,-18],[4,7,-19],
[0,3,-8],[7,3,-10],[-7,3,-8]
].forEach(p=>makeAnchor(...p));

const controllers=[0,1].map(i=>renderer.xr.getController(i));
const controllerGrips=[null,null];
const ropes=[0,1].map(()=>new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0x9cf8ff,transparent:true,opacity:.95})));
ropes.forEach(r=>{r.visible=false;scene.add(r)});

const grapple=[null,null];
const handVel=[new THREE.Vector3(),new THREE.Vector3()];
const prevHand=[new THREE.Vector3(),new THREE.Vector3()];
let havePrev=[false,false];
const velocity=new THREE.Vector3();

const modelFactory=new XRControllerModelFactory();
controllers.forEach((c,i)=>{
 scene.add(c);
 c.addEventListener("connected",()=>{
   const grip=renderer.xr.getControllerGrip(i);
   grip.add(modelFactory.createControllerModel(grip));scene.add(grip);controllerGrips[i]=grip;
 });
 c.addEventListener("selectstart",()=>attach(i));
 c.addEventListener("selectend",()=>detach(i));
});

function closestAnchor(pos){
 let best=null,bestD=2.2;
 for(const a of anchors){const p=a.getWorldPosition(new THREE.Vector3());const d=p.distanceTo(pos);if(d<bestD){bestD=d;best=a}}
 return best;
}
function attach(i){
 const p=controllers[i].getWorldPosition(new THREE.Vector3());
 const a=closestAnchor(p);
 if(a){grapple[i]=a;ropes[i].visible=true}
}
function detach(i){
 if(!grapple[i])return;
 const cp=controllers[i].getWorldPosition(new THREE.Vector3());
 const pp=player.getWorldPosition(new THREE.Vector3());
 const away=pp.clone().sub(cp).normalize();
 velocity.addScaledVector(away,1.7);
 velocity.add(handVel[i].multiplyScalar(.55));
 grapple[i]=null;ropes[i].visible=false;
}

function updateHands(dt){
 for(let i=0;i<2;i++){
   const p=controllers[i].getWorldPosition(new THREE.Vector3());
   if(havePrev[i]) handVel[i].copy(p).sub(prevHand[i]).multiplyScalar(1/Math.max(dt,.001));
   prevHand[i].copy(p);havePrev[i]=true;
 }
}

function grapplePhysics(dt){
 let active=0;
 for(let i=0;i<2;i++) if(grapple[i]) active++;
 if(!active)return;

 const pp=player.getWorldPosition(new THREE.Vector3());
 for(let i=0;i<2;i++){
   if(!grapple[i])continue;
   active++;
   const ap=grapple[i].getWorldPosition(new THREE.Vector3());
   const cp=controllers[i].getWorldPosition(new THREE.Vector3());
   const dir=ap.clone().sub(pp);const d=dir.length();
   if(d>.55){
     dir.normalize();
     // Smooth spring pull. Dual grapples average naturally through the shared velocity.
     const targetSpeed=Math.min(12,3+d*1.8);
     const along=velocity.dot(dir);
     velocity.addScaledVector(dir,(targetSpeed-along)*Math.min(1,dt*5));
   }
   // Rope
   const arr=ropes[i].geometry.attributes.position.array;
   arr[0]=cp.x;arr[1]=cp.y;arr[2]=cp.z;arr[3]=ap.x;arr[4]=ap.y;arr[5]=ap.z;
   ropes[i].geometry.attributes.position.needsUpdate=true;
 }
 // Slight gravity-like drift while airborne; floor handles landing.
 velocity.y-=2.2*dt;
}

const keys={};
addEventListener("keydown",e=>keys[e.code]=true);
addEventListener("keyup",e=>keys[e.code]=false);
function desktopMove(dt){
 if(renderer.xr.isPresenting)return;
 const f=new THREE.Vector3(0,0,-1),r=new THREE.Vector3(1,0,0),m=new THREE.Vector3();
 if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyD)m.add(r);if(keys.KeyA)m.sub(r);
 if(m.lengthSq())velocity.addScaledVector(m.normalize(),5*dt);
 if(keys.Space && player.position.y<.05)velocity.y=5.5;
}

document.querySelector("#reset").onclick=()=>{player.position.set(0,0,4);velocity.set(0,0,0)};
const clock=new THREE.Clock();
function loop(){
 const dt=Math.min(clock.getDelta(),.033);
 updateHands(dt);
 desktopMove(dt);
 grapplePhysics(dt);

 // Ground + damping. Less damping while grappling keeps swings feeling alive.
 if(player.position.y<=0){player.position.y=0;if(velocity.y<0)velocity.y=0;velocity.multiplyScalar(Math.pow(.002,dt))}
 else velocity.multiplyScalar(Math.pow(.18,dt));
 player.position.addScaledVector(velocity,dt);

 // Keep the test arena bounded.
 player.position.x=THREE.MathUtils.clamp(player.position.x,-11,11);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-25,7);
 if(player.position.y>12){player.position.y=12;velocity.y=Math.min(velocity.y,0)}

 renderer.render(scene,camera);
}
renderer.setAnimationLoop(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
